<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessions - graph-agent studio</title>
  <script>
    if (localStorage.theme === 'dark') { document.documentElement.classList.add('dark'); }
    else { document.documentElement.classList.remove('dark'); }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%229%22 width=%2224%22 height=%2214%22 rx=%223%22 fill=%22none%22 stroke=%22%230f766e%22 stroke-width=%222.5%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%223%22 fill=%22%230f766e%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/tailwind.css">
</head>
<body class="bg-bg text-ink font-sans antialiased min-h-screen overflow-x-hidden">
<main class="max-w-[1200px] mx-auto px-5 py-4 pb-6">
  <header class="relative z-50 flex justify-between gap-4 items-start sm:items-end border-b border-line pb-3 mb-4">
    <div class="min-w-0 flex-1 pr-2">
      <div class="text-[10px] font-bold text-accent tracking-widest uppercase">BPMN-controlled agent</div>
      <h1 class="text-xl sm:text-2xl md:text-3xl font-bold tracking-tight text-ink mt-0.5 mb-0.5">Sessions</h1>
      <p class="text-muted text-xs sm:text-[13px] leading-relaxed hidden sm:block">Each session is a live BPMN process. The graph both drives the agent and records what it did.</p>
    </div>
    <nav class="hidden md:flex items-center gap-1.5 shrink-0">
      <a href="/" class="nav-link active">Sessions</a>
      <a href="/editor" class="nav-link">Editor</a>
      <button onclick="toggleTheme()" class="btn btn-secondary text-xs px-2 py-1 ml-1" title="Toggle light/dark theme">
        <span class="theme-toggle-icon">&#9728;</span>
      </button>
    </nav>
    <div class="md:hidden flex items-center gap-2 shrink-0">
      <button onclick="toggleTheme()" class="btn btn-secondary text-xs px-2 py-1" title="Toggle light/dark theme">
        <span class="theme-toggle-icon">&#9728;</span>
      </button>
      <button id="mobile-menu-btn" class="p-2 rounded-md bg-panel border border-line text-ink" aria-label="Toggle menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden absolute top-full right-0 mt-1 w-44 py-2 bg-panel border border-line rounded-lg shadow-2xl z-[1000] flex flex-col gap-1">
      <a href="/" class="nav-link mx-2 active">Sessions</a>
      <a href="/editor" class="nav-link mx-2">Editor</a>
    </div>
  </header>

  <section class="mb-6">
    <h2 class="text-sm font-bold uppercase tracking-wider text-muted mb-2">Sessions</h2>
    <div id="sessions" class="grid gap-2"></div>
    <p id="sessions-empty" class="hidden text-muted text-sm py-6">No sessions yet. Start one with <code class="font-mono text-xs bg-panel-header px-1 py-0.5 rounded">graph-agent run "..."</code>.</p>
  </section>

  <section>
    <h2 class="text-sm font-bold uppercase tracking-wider text-muted mb-2">Workflows</h2>
    <div id="workflows" class="grid gap-2"></div>
  </section>
</main>
<script src="/static/pages/base.js" defer></script>
<script src="/static/pages/index.js" defer></script>
</body>
</html>
