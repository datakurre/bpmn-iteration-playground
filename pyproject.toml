[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name="graph-agent"
version="0.1.0"
requires-python=">=3.11"
dependencies = [
    "spiffworkflow==3.2.0",
    "fastapi",
    "uvicorn[standard]",
    "ZODB",
    "transaction",
    "python-dotenv",
    "pydantic",
    "jinja2",
    "httpx",
    "defusedxml>=0.7.1",
]

[project.scripts]
graph-agent = "graph_agent.cli:main"
bpmn = "graph_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
    "mypy>=1.14",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.16.4",
]

# The wheel ships graph_agent/ only. Browser-UI assets (bpmn-js, form-js, the built modeler
# and viewer bundles) are non-.py package data under graph_agent/static/ and
# graph_agent/templates/; `npm run build` must have populated them before `uv build` runs.
# workspace_templates/ and the pi-demo mock live under graph_agent/data/ as ordinary package
# files -- no special include needed beyond the package itself, since hatchling includes
# non-.py files under an included package by default.
[tool.hatch.build.targets.wheel]
packages = ["graph_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Guards against a known pre-existing hang, not caused by any single test: a
# request that fires a background job (asyncio.create_task, e.g. a pi_agent/shell
# turn in WorkflowService) can outlive the request. Starlette's TestClient opens
# a fresh event-loop thread per call and joins it on exit; if that job is still
# pending when the call's portal tries to shut down, cancelling it doesn't
# always let the loop finish tearing down (most likely an abandoned
# asyncio.to_thread() worker, since a started thread can't actually be
# interrupted -- only stopped being awaited), and `thread.join()` blocks
# forever. Which test trips it varies by run (cumulative, not deterministic).
# `thread` mode hard-exits the process on timeout -- a `Thread.join()`-style
# hang doesn't reliably respond to signal-based timeouts -- turning a silent
# CI hang into a fast, loud failure with a full stack trace naming the actual
# stuck call.
timeout = 60
timeout_method = "thread"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["vendor", "node_modules"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports/vars, undefined names -- the bugs an agent leaves behind
    "B",    # flake8-bugbear: mutable defaults, loop-var closures, bare except, etc.
    "C4",   # flake8-comprehensions: unnecessary list/dict/set comprehensions
    "SIM",  # flake8-simplify: redundant conditionals/branches
    "UP",   # pyupgrade: modern syntax, dead compatibility shims
    "I",    # isort: consistent import order (deterministic diffs)
    "N",    # pep8-naming
    "RUF",  # ruff-specific (e.g. no implicit Optional confusion, useless noqa)
    "C90",  # mccabe complexity
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # pylint: too many returns/branches/args/statements
]
ignore = [
    "E501",  # line length is a soft target here (many long call sites); not worth churn-only fixes
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header()/Query() and this app's require_role() are the idiomatic way
# to declare a route dependency as a default argument -- not the mutable-default footgun B008
# exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "graph_agent.auth.require_role"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 20
max-returns = 8
max-args = 8
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR0915", "N802"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["graph_agent"]
branch = true
omit = ["graph_agent/main.py", "graph_agent/handlers/base.py"]

[tool.coverage.report]
show_missing = true
fail_under = 83
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

