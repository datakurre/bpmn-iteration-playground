<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pi Workflow Studio{% endblock %}</title>
  <script>
    // Theme Initializer: Default to light theme
    if (localStorage.theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="stylesheet" href="/static/app/tailwind.css?v=4">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-bg text-ink font-sans antialiased min-h-screen overflow-x-hidden">
  {% block content %}{% endblock %}
  <script>
  function toggleTheme() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.theme = isDark ? 'dark' : 'light';
    updateThemeIcons();
  }

  function updateThemeIcons() {
    const isDark = document.documentElement.classList.contains('dark');
    document.querySelectorAll('.theme-toggle-icon').forEach(el => {
      el.textContent = isDark ? '☀️' : '🌙';
    });
    document.querySelectorAll('.theme-toggle-text').forEach(el => {
      el.textContent = isDark ? 'Light' : 'Dark';
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateThemeIcons();
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');
    if (btn && menu) {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('hidden');
      });
      document.addEventListener('click', (e) => {
        if (!menu.contains(e.target) && !btn.contains(e.target)) {
          menu.classList.add('hidden');
        }
      });
    }
  });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
