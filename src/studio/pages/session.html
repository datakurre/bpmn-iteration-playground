<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session</title>
  <script>
    if (localStorage.theme === 'dark') { document.documentElement.classList.add('dark'); }
    else { document.documentElement.classList.remove('dark'); }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%229%22 width=%2224%22 height=%2214%22 rx=%223%22 fill=%22none%22 stroke=%22%230f766e%22 stroke-width=%222.5%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%223%22 fill=%22%230f766e%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/tailwind.css">
  <link rel="stylesheet" href="/static/vendor/bpmn-js/assets/diagram-js.css">
  <link rel="stylesheet" href="/static/vendor/bpmn-js/assets/bpmn-font/css/bpmn.css">
  <link rel="stylesheet" href="/static/vendor/bpmn-js/assets/bpmn-js.css">
  <link rel="stylesheet" href="/static/diagram-js-minimap.css">
  <link rel="stylesheet" href="/static/properties-panel.css">
  <link rel="stylesheet" href="/static/element-template-chooser.css">
  <link rel="stylesheet" href="/static/vendor/form-js/assets/form-js.css">
</head>
<body class="bg-bg text-ink font-sans antialiased min-h-screen overflow-x-hidden">
<main class="max-w-[1600px] mx-auto px-5 py-4 pb-6">
  <header class="relative z-50 flex justify-between gap-4 items-start sm:items-end border-b border-line pb-3 mb-4">
    <div class="min-w-0 flex-1 pr-2">
      <div class="text-[10px] font-bold text-accent tracking-widest uppercase">graph-agent</div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-ink mt-0.5 mb-0.5"><span id="project-name">&hellip;</span></h1>
      <p id="project-path" class="text-muted text-[11px] font-mono truncate hidden sm:block"></p>
    </div>
    <nav id="shell-nav" class="hidden md:flex items-center gap-1.5 shrink-0"></nav>
    <div class="md:hidden flex items-center gap-2 shrink-0 relative">
      <button onclick="toggleTheme()" class="btn btn-secondary text-xs px-2 py-1" title="Toggle light/dark theme">
        <span class="theme-toggle-icon">&#9728;</span>
      </button>
      <button id="mobile-menu-btn" class="p-2 rounded-md bg-panel border border-line text-ink" aria-label="Toggle menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div id="mobile-menu" class="hidden absolute right-0 top-full mt-2 w-40 bg-panel border border-line rounded-lg shadow-xl p-1.5 z-50 flex flex-col gap-1"></div>
    </div>
  </header>

  <div class="flex items-baseline gap-2 mb-3 flex-wrap">
    <h2 id="session-title" class="text-lg font-bold text-ink truncate">&hellip;</h2>
    <span id="session-status"></span>
    <span id="session-cost" class="hidden font-mono text-xs px-2 py-0.5 rounded bg-accent-dim text-accent border border-accent-border font-bold"></span>
    <span id="session-meta" class="text-muted text-xs"></span>
    <span class="flex-1"></span>
    <button id="edit-btn" class="btn btn-secondary px-2.5 py-1 text-xs" title="Edit this session's graph">Edit</button>
    <button id="save-btn" class="btn px-2.5 py-1 text-xs hidden" title="Save (elements the token has visited cannot be removed)">Save</button>
    <button id="cancel-btn" class="btn btn-secondary px-2.5 py-1 text-xs hidden" title="Discard changes">Cancel</button>
  </div>

  <div id="edit-msg" class="hidden mb-2"></div>

  <div class="flex flex-col lg:flex-row gap-3 h-[calc(100vh-190px)] min-h-[480px]">
    <div class="flex-1 min-h-0 relative bg-white rounded-lg overflow-hidden border border-line shadow-2xl flex">
      <div id="viewer" class="w-full h-full bg-white relative">
        <div class="diagram-controls !left-4">
          <button class="ctrl-btn" id="ctrl-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button class="ctrl-btn" id="ctrl-zoom-out" title="Zoom out" aria-label="Zoom out">-</button>
          <button class="ctrl-btn" id="ctrl-zoom-fit" title="Fit diagram" aria-label="Fit diagram">Fit</button>
          <button class="ctrl-btn" id="ctrl-zoom-reset" title="Reset zoom" aria-label="Reset zoom">1:1</button>
          <button class="ctrl-btn" id="ctrl-minimap" title="Toggle minimap" aria-label="Toggle minimap">Map</button>
        </div>
      </div>
      <div id="editor" class="hidden modeler-canvas flex-1 h-full min-w-[300px] relative bg-white"></div>
      <aside id="properties-container" class="hidden properties-container w-[320px] min-w-[240px] max-w-[600px] h-full flex-col bg-panel border-l border-line overflow-hidden">
        <div class="px-3 py-2 bg-panel-header border-b border-line text-[11.5px] font-bold tracking-wider uppercase text-ink shrink-0">Element properties</div>
        <div id="properties-panel" class="flex-1 overflow-y-auto bg-card text-ink"></div>
      </aside>
    </div>

    <aside class="w-full lg:w-[420px] shrink-0 flex flex-col gap-3 min-h-0">
      <section id="pending-section" class="hidden bg-panel border border-line rounded-lg overflow-hidden">
        <h3 class="px-3 py-2 bg-panel-header border-b border-line text-[11.5px] font-bold tracking-wider uppercase">Waiting on you</h3>
        <div id="pending-gates" class="max-h-64 overflow-y-auto text-xs"></div>
      </section>
      <section class="bg-panel border border-line rounded-lg overflow-hidden flex flex-col min-h-0 flex-1">
        <div class="px-3 py-2 bg-panel-header border-b border-line flex items-center justify-between">
          <div class="flex gap-2">
            <button id="tab-btn-turns" class="text-[11.5px] font-bold tracking-wider uppercase text-accent border-b-2 border-accent pb-0.5">Turns</button>
            <button id="tab-btn-activities" class="text-[11.5px] font-bold tracking-wider uppercase text-muted hover:text-ink pb-0.5">Activities</button>
          </div>
          <div id="turns-actions" class="flex items-center gap-1">
            <button type="button" id="btn-toggle-expand-all" class="text-[10.5px] font-medium text-muted hover:text-ink px-1.5 py-0.5 rounded border border-line hover:bg-panel-header transition-colors" title="Expand/collapse all turn details">Expand all</button>
          </div>
        </div>
        <div id="turns-filter-container" class="p-2 border-b border-line bg-panel-alt flex flex-col gap-1.5">
          <div class="flex items-center justify-between gap-1">
            <div class="flex items-center gap-1 text-[10.5px]">
              <button type="button" class="turn-filter-btn active px-2 py-0.5 rounded font-semibold bg-accent text-btn-text" data-filter="all">All</button>
              <button type="button" class="turn-filter-btn px-2 py-0.5 rounded font-semibold text-muted hover:text-ink hover:bg-panel-header border border-line" data-filter="tools">Tools</button>
              <button type="button" class="turn-filter-btn px-2 py-0.5 rounded font-semibold text-muted hover:text-ink hover:bg-panel-header border border-line" data-filter="errors">Errors</button>
            </div>
            <input type="text" id="turn-search-input" placeholder="Search turns, tools..." class="text-[11px] px-2 py-0.5 rounded border border-line bg-card text-ink placeholder-muted focus:outline-none focus:border-accent w-36 sm:w-44" />
          </div>
        </div>
        <div id="turns" class="flex-1 overflow-y-auto text-xs"></div>
        <div id="activities" class="hidden flex-1 overflow-y-auto text-xs"></div>
      </section>
      <section class="bg-panel border border-line rounded-lg overflow-hidden">
        <h3 class="px-3 py-2 bg-panel-header border-b border-line text-[11.5px] font-bold tracking-wider uppercase">Graph revisions</h3>
        <div id="revisions" class="max-h-40 overflow-y-auto text-xs"></div>
      </section>
    </aside>
  </div>
</main>
<script src="/static/bpmn-viewer-bundle.js"></script>
<script src="/static/bpmn-modeler-bundle.js"></script>
<script src="/static/vendor/form-js/form-viewer.umd.js"></script>
<script src="/static/pages/session.js" defer></script>
</body>
</html>
