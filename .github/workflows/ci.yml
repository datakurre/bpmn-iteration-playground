name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov mypy anyio starlette httpx types-requests

      - name: Install Node dependencies
        run: npm ci

      # Only the element-templates submodules, not vendor/agent-sandbox (which uses an
      # SSH remote and isn't needed for the frontend build).
      - name: Checkout vendored element-templates submodules
        run: |
          git submodule update --init \
            vendor/operaton-element-templates \
            vendor/operaton-element-templates-validator \
            vendor/operaton-element-templates-json-schema

      - name: Build vendored element-templates submodules
        run: |
          cd vendor/operaton-element-templates-json-schema && npm install && npm run build && cd -
          cd vendor/operaton-element-templates-validator && npm install && cd -
          cd vendor/operaton-element-templates && npm install

      - name: Run Python tests
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Run Python lint / typecheck
        run: mypy app/

      - name: Build frontend assets
        run: npm run build

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run JS/TS tests
        run: npm test -- --coverage
