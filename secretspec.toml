[project]
name = "bpmn-ai-starter"
revision = "1.0"

[defaults]
provider = "env"

[providers]
env = "env://"

[profiles.default]
OPENCODE_ZEN_API_KEY = { description = "OpenCode Zen API key", required = false }
OPENCODE_GO_API_KEY = { description = "OpenCode Go API key", required = false }

[scopes.opencode]
secrets = ["OPENCODE_ZEN_API_KEY", "OPENCODE_GO_API_KEY"]
