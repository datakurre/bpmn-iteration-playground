[project]
name="bpmn-ai-starter"
version="0.1.0"
requires-python=">=3.11"
dependencies = [
    "spiffworkflow==3.2.0",
    "fastapi",
    "uvicorn[standard]",
    "ZODB",
    "transaction",
    "python-dotenv",
    "pydantic",
    "jinja2",
    "httpx",
    "ZEO",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
    "mypy>=1.14",
    "pytest-cov>=6.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["vendor", "node_modules"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports/vars, undefined names -- the bugs an agent leaves behind
    "B",    # flake8-bugbear: mutable defaults, loop-var closures, bare except, etc.
    "C4",   # flake8-comprehensions: unnecessary list/dict/set comprehensions
    "SIM",  # flake8-simplify: redundant conditionals/branches
    "UP",   # pyupgrade: modern syntax, dead compatibility shims
    "I",    # isort: consistent import order (deterministic diffs)
    "N",    # pep8-naming
    "RUF",  # ruff-specific (e.g. no implicit Optional confusion, useless noqa)
    "C90",  # mccabe complexity
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # pylint: too many returns/branches/args/statements
]
ignore = [
    "E501",  # line length is a soft target here (many long call sites); not worth churn-only fixes
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header()/Query() and this app's require_role() are the idiomatic way
# to declare a route dependency as a default argument -- not the mutable-default footgun B008
# exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "app.auth.require_role"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 20
max-returns = 8
max-args = 8
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR0915", "N802"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py", "app/handlers/base.py"]

[tool.coverage.report]
show_missing = true
fail_under = 83
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

