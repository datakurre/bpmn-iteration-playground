[project]
name="bpmn-ai-starter"
version="0.1.0"
requires-python=">=3.11"
dependencies = [
    "spiffworkflow==3.2.0",
    "fastapi",
    "uvicorn[standard]",
    "ZODB",
    "transaction",
    "python-dotenv",
    "pydantic",
    "jinja2",
    "httpx",
    "ZEO",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
    "mypy>=1.14",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py", "app/handlers/base.py"]

[tool.coverage.report]
show_missing = true
fail_under = 83
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

