<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pi Workflow Studio{% endblock %}</title>
  <script>
    // Theme Initializer: Default to light theme
    if (localStorage.theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="stylesheet" href="/static/app/tailwind.css?v=4">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-bg text-ink font-sans antialiased min-h-screen overflow-x-hidden">
  {% block content %}{% endblock %}
  <script src="/static/app/pages/base.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
